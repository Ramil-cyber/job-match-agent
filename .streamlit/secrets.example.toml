# Safe template only. Copy to secrets.toml locally or paste real values into
# Streamlit Community Cloud. Never commit the real secrets file.

OPENAI_API_KEY = "your_openai_api_key_here"
ENABLE_PUBLIC_OPENAI_ANALYSIS = "false"
PUBLIC_ANALYSIS_USER_LIMIT = "3"
PUBLIC_ANALYSIS_DAILY_LIMIT = "10"
PUBLIC_ANALYSIS_TOTAL_LIMIT = "100"
PUBLIC_MAX_RESUME_CHARACTERS = "8000"
PUBLIC_MAX_JOB_CHARACTERS = "8000"
PUBLIC_MAX_OUTPUT_TOKENS = "3000"
SUPABASE_URL = "https://your-project.supabase.co"
SUPABASE_SECRET_KEY = "your_supabase_secret_key_here"
USER_HASH_SALT = "replace_with_a_long_random_secret"

[auth]
redirect_uri = "https://ramil-job-match-demo.streamlit.app/oauth2callback"
cookie_secret = "replace_with_a_long_random_cookie_secret"
client_id = "your_google_oauth_client_id"
client_secret = "your_google_oauth_client_secret"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
client_kwargs = { "prompt" = "select_account" }
